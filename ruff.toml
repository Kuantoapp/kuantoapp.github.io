# Los scripts que ejecutan los hooks corren con el python3 del sistema (3.9 en macOS):
# ruff no debe «modernizarlos» con sintaxis que esa versión no entiende.
[per-file-target-version]
".claude/hooks/*.py" = "py39"
".github/scripts/*.py" = "py39"
".claude/skills/*/scripts/*.py" = "py39"  # solo stdlib: cualquier python3

# Código mínimo (skill dm-codigo-minimo): lo que una máquina puede comprobar siempre.
# Argumentos sin usar, código comentado, funciones demasiado complejas, demasiados parámetros y print olvidados.
[lint]
extend-select = ["ARG", "ERA001", "C901", "PLR0913", "T201"]

[lint.per-file-ignores]
# Herramientas del repo (hooks, validadores, scripts de skills): imprimir es su salida y son CLI ya probadas
".claude/**" = ["T201", "C901", "PLR0913"]
".github/**" = ["T201", "C901"]
# Dobles de prueba con la firma de la función real
"tests/**" = ["ARG"]
# Explorar en un notebook imprime
"notebooks/**" = ["T201"]
