name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
permissions:
  contents: read
  pull-requests: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - name: La rama debe llamarse <tu-usuario>/<tema>
        env:
          HEAD: ${{ github.head_ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          case "$HEAD" in
            "$AUTHOR"/*) ;;
            dependabot/*) [ "$AUTHOR" = "dependabot[bot]" ] || { echo "Las ramas dependabot/ son solo de Dependabot"; exit 1; } ;;
            *) echo "Rama '$HEAD' debe empezar por '$AUTHOR/'"; exit 1;;
          esac

      - name: Bloquear ficheros sensibles o dependencias versionadas
        run: |
          bad=$(git ls-files | grep -Ei '(^|/)(node_modules|venv|\.venv|__pycache__)/|(^|/)\.env[^/]*$|(^|/)(credentials|secrets?)[^/]*\.(json|ya?ml|txt)$|(^|/)id_(rsa|ed25519)$|\.(pem|key|p12|pfx)$|(^|/)\.pgpass$' | grep -v '\.env\.example$' || true)
          if [ -n "$bad" ]; then echo "Ficheros prohibidos:"; echo "$bad"; exit 1; fi
          big=$(git ls-files -z | xargs -0 sh -c 'find "$@" -maxdepth 0 -type f -size +5M' _)
          if [ -n "$big" ]; then echo "Ficheros >5 MB (van en data/, sin versionar):"; echo "$big"; exit 1; fi

      - name: PR pequeño (<=800 líneas sin lockfiles; etiqueta pr-grande para saltarlo)
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'pr-grande') }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          n=$(git diff --numstat "$BASE"...HEAD -- . ':!*.lock' ':!*-lock.json' ':!*-lock.yaml' | awk '{s+=$1+$2} END {print s+0}')
          echo "Líneas cambiadas: $n"
          [ "$n" -le 800 ] || { echo "PR demasiado grande: pártelo (ver AGENTS.md)"; exit 1; }

      - name: Secretos, API keys y tokens (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

      - uses: actions/setup-python@v7
        with: { python-version-file: .python-version }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }

      - name: Agentes, skills y CLAUDE.md (reglas en .claude/README.md)
        run: pip install -r requirements-dev.txt && python .github/scripts/validar_claude.py

      - name: Cifras que ve el público con su fuente (app/ y docs/pitch/)
        run: python .github/scripts/cifras_con_fuente.py

      - name: Documentación al día (cambios con su documentación y sin referencias rotas)
        run: python .github/scripts/docs_al_dia.py

      - name: Revisores obligatorios (veredicto vigente por área tocada)
        run: python .github/scripts/revisiones.py

      - name: Cifras que ve el público con su fuente (app/ y docs/pitch/)
        run: python .github/scripts/cifras_con_fuente.py

      - name: Python (solo si hay)
        run: |
          if git ls-files | grep -qE '\.py$|^requirements.*\.txt$|^pyproject.toml$'; then
            ruff check . && ruff format --check .
            pip-audit -r requirements-dev.txt
            [ -f requirements.txt ] && pip install -r requirements.txt && pip-audit -r requirements.txt
            pytest -q || [ $? -eq 5 ]  # 5 = aún no hay tests
          else echo "Sin Python"; fi

      - name: Node (solo si hay)
        run: |
          if [ -f package.json ]; then
            npm ci
            npm audit --audit-level=high
            npm run --if-present lint && npm test --if-present
          else echo "Sin Node"; fi
