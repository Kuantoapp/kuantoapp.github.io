name: CI
on:
  pull_request:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Bloquear basura versionada (venv, node_modules, .env, claves)
        run: |
          bad=$(git ls-files | grep -E '(^|/)(node_modules|venv|\.venv|__pycache__)/|(^|/)\.env$|\.(pem|key)$' || true)
          if [ -n "$bad" ]; then echo "Ficheros prohibidos:"; echo "$bad"; exit 1; fi
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Lint y formato
        run: pip install ruff && ruff check . && ruff format --check .
      - name: Tests
        run: |
          pip install pytest
          [ -f requirements.txt ] && pip install -r requirements.txt
          pytest -q || [ $? -eq 5 ]  # 5 = aún no hay tests
