[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mesobra"
version = "0.1.0"
description = "¿Me sobra? DataMad 2026"
requires-python = "==3.14.*"
license = "MIT"
dependencies = ["mcp==2.3.0"]

[project.scripts]
mesobra-mcp = "mesobra.mcp_servidor:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mesobra"]

[tool.hatch.build.targets.wheel.force-include]
"app/datos" = "mesobra/datos"

[tool.pytest.ini_options]
pythonpath = ["src"]
